            String _getEmojiForType(String type, String cat) {
              if (type.contains('وارد')) return '💰';
              if (type.contains('سحب')) return '🏧';
              if (type.contains('صادر')) return '💸';
              if (type.contains('فاتورة')) return '⚡';
              if (cat == 'مطاعم') return '🍔';
              if (cat == 'قهوة') return '☕';
              if (cat == 'بنزين') return '⛽';
              if (cat == 'سوبر ماركت') return '🛒';
              if (cat == 'تسوق') return '🛍️';
              return '💳';
            }

            Color _getTypeBadgeColor(String type, bool isInflow) {
              if (isInflow) return const Color(0xFF10B981);
              if (type.contains('صادر')) return const Color(0xFF3B82F6);
              if (type.contains('سحب')) return const Color(0xFFF59E0B);
              if (type.contains('فاتورة')) return const Color(0xFF8B5CF6);
              return const Color(0xFF0C3B2E);
            }
          }

          // 2. REPORTS TAB WITH ACTIVE CHARTS AND INCOME VS EXPENSE
          class ReportsScreenTab extends StatefulWidget {
            final List<Expense> expenses;
            const ReportsScreenTab({super.key, required this.expenses});

            @override
            State<ReportsScreenTab> createState() => _ReportsScreenTabState();
          }

          class _ReportsScreenTabState extends State<ReportsScreenTab> {
            int _selectedYear = 2026;
            int _selectedMonth = 8;

            final List<int> _years = [2026, 2025, 2024];
            final List<String> _months = [
              'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
              'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
            ];

            @override
            Widget build(BuildContext context) {
              final monthExpenses = widget.expenses.where((e) {
                return e.date.year == _selectedYear && e.date.month == _selectedMonth;
              }).toList();

              double totalOutflow = monthExpenses
                  .where((e) => e.isInflow == 0)
                  .fold(0.0, (sum, i) => sum + i.amount);

              double totalInflow = monthExpenses
                  .where((e) => e.isInflow == 1)
                  .fold(0.0, (sum, i) => sum + i.amount);

              Map<String, double> catTotals = {};
              for (var exp in monthExpenses.where((e) => e.isInflow == 0)) {
                catTotals[exp.category] = (catTotals[exp.category] ?? 0.0) + exp.amount;
              }

              final palette = [
                const Color(0xFF0C3B2E),
                const Color(0xFFE5A93C),
                const Color(0xFF0284C7),
                const Color(0xFF10B981),
                const Color(0xFF8B5CF6),
                const Color(0xFFEC4899),
                const Color(0xFFF97316),
              ];

              int idx = 0;
              List<PieChartSectionData> sections = [];
              catTotals.forEach((k, v) {
                sections.add(PieChartSectionData(
                  value: v,
                  title: '',
                  radius: 26,
                  color: palette[idx % palette.length],
                ));
                idx++;
              });

              return Scaffold(
                appBar: AppBar(
                  title: const Text('التقارير والتحليلات 📊'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: _years.map((y) {
                        final isSel = y == _selectedYear;
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 4),
                          child: ChoiceChip(
                            label: Text('$y'),
                            selected: isSel,
                            selectedColor: const Color(0xFF0C3B2E),
                            backgroundColor: Colors.white,
                            labelStyle: TextStyle(
                              color: isSel ? Colors.white : const Color(0xFF4A5568),
                              fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                            ),
                            onSelected: (val) {
                              if (val) setState(() => _selectedYear = y);
                            },
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 10),

                    SizedBox(
                      height: 38,
                      child: ListView.builder(
                        scrollDirection: Axis.horizontal,
                        itemCount: _months.length,
                        itemBuilder: (ctx, i) {
                          final mIndex = i + 1;
                          final isSel = mIndex == _selectedMonth;
                          return Padding(
                            padding: const EdgeInsets.only(left: 6),
                            child: ChoiceChip(
                              label: Text(_months[i]),
                              selected: isSel,
                              selectedColor: const Color(0xFFE5A93C),
                              backgroundColor: Colors.white,
                              labelStyle: TextStyle(
                                color: isSel ? Colors.white : const Color(0xFF4A5568),
                                fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                              ),
                              onSelected: (val) {
                                if (val) setState(() => _selectedMonth = mIndex);
                              },
                            ),
                          );
                        },
                      ),
                    ),
                    const SizedBox(height: 20),

                    Row(
                      children: [
                        Expanded(
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(18),
                              border: Border.all(color: const Color(0xFF10B981).withOpacity(0.3)),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('الدخل والوارد 🟢', style: TextStyle(color: Color(0xFF718096), fontSize: 12)),
                                const SizedBox(height: 6),
                                FittedBox(
                                  child: Text(
                                    '+${totalInflow.toStringAsFixed(2)} ر.س',
                                    style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold, fontSize: 16),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(width: 10),
                        Expanded(
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(18),
                              border: Border.all(color: const Color(0xFFEF4444).withOpacity(0.3)),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text('إجمالي الصادر 🔴', style: TextStyle(color: Color(0xFF718096), fontSize: 12)),
                                const SizedBox(height: 6),
                                FittedBox(
                                  child: Text(
                                    '-${totalOutflow.toStringAsFixed(2)} ر.س',
                                    style: const TextStyle(color: Color(0xFFEF4444), fontWeight: FontWeight.bold, fontSize: 16),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 20),

                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: const Color(0xFFE2EBE6)),
                      ),
                      child: Column(
                        children: [
                          const Text(
                            'توزيع المصاريف حسب التصنيف',
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Color(0xFF0C3B2E)),
                          ),
                          const SizedBox(height: 20),
                          SizedBox(
                            height: 200,
                            child: Stack(
                              alignment: Alignment.center,
                              children: [
                                PieChart(
                                  PieChartData(
                                    sectionsSpace: 3,
                                    centerSpaceRadius: 65,
                                    sections: sections.isEmpty
                                        ? <PieChartSectionData>[
                                            PieChartSectionData(
                                              value: 1,
                                              color: const Color(0xFFE2E8F0),
                                              radius: 20,
                                              showTitle: false,
                                            )
                                          ]
                                        : sections,
                                  ),
                                ),
                                Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    const Text('إجمالي الصرف', style: TextStyle(color: Color(0xFF718096), fontSize: 11)),
                                    Text(
                                      totalOutflow.toStringAsFixed(0),
                                      style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E)),
                                    ),
                                    const Text('ر.س', style: TextStyle(fontSize: 11, color: Color(0xFF718096))),
                                  ],
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),

                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: const Color(0xFFE2EBE6)),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('تفاصيل التصنيفات', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Color(0xFF0C3B2E))),
                          const SizedBox(height: 12),
                          if (catTotals.isEmpty)
                            const Padding(
                              padding: EdgeInsets.all(16.0),
                              child: Center(child: Text('لا توجد مصاريف مسجلة في هذا الشهر', style: TextStyle(color: Color(0xFF718096)))),
                            )
                          else
                            ...catTotals.entries.map((e) {
                              double p = totalOutflow > 0 ? (e.value / totalOutflow) : 0.0;
                              return Padding(
                                padding: const EdgeInsets.symmetric(vertical: 8),
                                child: Column(
                                  children: [
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        Text(e.key, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E))),
                                        Text(
                                          '${e.value.toStringAsFixed(1)} ر.س (${(p * 100).toStringAsFixed(0)}%)',
                                          style: const TextStyle(color: Color(0xFF718096), fontSize: 13, fontWeight: FontWeight.bold),
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 6),
                                    LinearProgressIndicator(
                                      value: p,
                                      backgroundColor: const Color(0xFFF3F7F5),
                                      valueColor: const AlwaysStoppedAnimation(Color(0xFF0C3B2E)),
                                      minHeight: 6,
                                      borderRadius: BorderRadius.circular(6),
                                    ),
                                  ],
                                ),
                              );
                            }),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // 3. BUDGET & SAVINGS TAB
          class BudgetScreenTab extends StatelessWidget {
            final List<Expense> expenses;
            final List<SavingsBox> savingsBoxes;

            const BudgetScreenTab({
              super.key,
              required this.expenses,
              required this.savingsBoxes,
            });

            @override
            Widget build(BuildContext context) {
              final appState = HassalahApp.of(context);
              double budget = appState?.monthlyBudget ?? 5000.0;

              return Scaffold(
                appBar: AppBar(
                  title: const Text('الميزانية وصناديق الادخار 🏦'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: const Color(0xFFE2EBE6)),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('سقف الميزانية الشهري', style: TextStyle(color: Color(0xFF718096), fontSize: 14)),
                              IconButton(
                                icon: const Icon(Icons.edit_note_rounded, color: Color(0xFF0C3B2E)),
                                onPressed: () => _editBudgetDialog(context, budget),
                              ),
                            ],
                          ),
                          Text(
                            '${budget.toStringAsFixed(0)} ر.س',
                            style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E)),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 24),

                    const Text(
                      'صناديق حصّالة (أهداف الادخار) 🎯',
                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E)),
                    ),
                    const SizedBox(height: 12),

                    ...savingsBoxes.map((box) {
                      double p = (box.current / box.target).clamp(0.0, 1.0);
                      return Container(
                        margin: const EdgeInsets.only(bottom: 12),
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(20),
                          border: Border.all(color: const Color(0xFFE2EBE6)),
                        ),
                        child: Column(
                          children: [
                            Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(10),
                                  decoration: BoxDecoration(
                                    color: box.color.withOpacity(0.1),
                                    borderRadius: BorderRadius.circular(14),
                                  ),
                                  child: Text(box.emoji, style: const TextStyle(fontSize: 22)),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(box.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Color(0xFF0C3B2E))),
                                      const SizedBox(height: 2),
                                      Text(
                                        'تم تجميع ${box.current.toStringAsFixed(0)} من ${box.target.toStringAsFixed(0)} ر.س',
                                        style: const TextStyle(color: Color(0xFF718096), fontSize: 12),
                                      ),
                                    ],
                                  ),
                                ),
                                Text(
                                  '${(p * 100).toStringAsFixed(0)}%',
                                  style: TextStyle(fontWeight: FontWeight.bold, color: box.color, fontSize: 16),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            ClipRRect(
                              borderRadius: BorderRadius.circular(6),
                              child: LinearProgressIndicator(
                                value: p,
                                minHeight: 6,
                                backgroundColor: const Color(0xFFF3F7F5),
                                valueColor: AlwaysStoppedAnimation(box.color),
                              ),
                            ),
                          ],
                        ),
                      );
                    }),
                  ],
                ),
              );
            }

            void _editBudgetDialog(BuildContext context, double currentBudget) {
              final controller = TextEditingController(text: currentBudget.toStringAsFixed(0));
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('تعديل سقف الميزانية الشهري'),
                  content: TextField(
                    controller: controller,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(labelText: 'الميزانية (ر.س)'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('إلغاء')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0C3B2E)),
                      onPressed: () {
                        double? val = double.tryParse(controller.text);
                        if (val != null && val > 0) {
                          HassalahApp.of(context)?.updateBudget(val);
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text('حفظ', style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }
          }

          // 4. SETTINGS TAB WITH RE-PARSE BUTTON
          class SettingsScreenTab extends StatelessWidget {
            final VoidCallback onReParseSms;

            const SettingsScreenTab({super.key, required this.onReParseSms});

            @override
            Widget build(BuildContext context) {
              final appState = HassalahApp.of(context);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('إعدادات حصّالة ⚙️'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    _buildSettingsGroup('إدارة البيانات والمزامنة', <Widget>[
                      ListTile(
                        leading: const Icon(Icons.refresh_rounded, color: Color(0xFF0C3B2E)),
                        title: const Text('إعادة قراءة وتصنيف كافة الرسائل بدقة', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                        subtitle: const Text('إعادة تحليل العمليات وتفصيل الحوالات والمدى', style: TextStyle(fontSize: 12, color: Color(0xFF718096))),
                        onTap: onReParseSms,
                      ),
                    ]),
                    const SizedBox(height: 16),

                    _buildSettingsGroup('دورة الحسابات والراتب', <Widget>[
                      ListTile(
                        title: const Text('بداية الشهر المالي (يوم الراتب)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                        subtitle: Text('يتم احتساب المصاريف بداية من يوم ${appState?.salaryStartDay ?? 25} من كل شهر', style: const TextStyle(fontSize: 12, color: Color(0xFF718096))),
                        trailing: Container(
                          padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                          decoration: BoxDecoration(color: const Color(0xFFF3F7F5), borderRadius: BorderRadius.circular(10)),
                          child: Text('يوم ${appState?.salaryStartDay ?? 25}', style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E))),
                        ),
                        onTap: () => _chooseSalaryDay(context),
                      ),
                    ]),
                    const SizedBox(height: 16),

                    _buildSettingsGroup('الأمان والخصوصية', <Widget>[
                      SwitchListTile(
                        activeColor: const Color(0xFF0C3B2E),
                        title: const Text('القفل بالبصمة / كلمة المرور', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                        subtitle: const Text('حماية بياناتك المالية عند فتح التطبيق', style: TextStyle(fontSize: 12, color: Color(0xFF718096))),
                        value: appState?.isBiometricEnabled ?? false,
                        onChanged: (val) => appState?.toggleBiometric(val),
                      ),
                    ]),
                  ],
                ),
              );
            }

            Widget _buildSettingsGroup(String title, List<Widget> children) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: Color(0xFF0C3B2E))),
                  const SizedBox(height: 8),
                  Container(
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: const Color(0xFFE2EBE6)),
                    ),
                    child: Column(children: children),
                  ),
                ],
              );
            }

            void _chooseSalaryDay(BuildContext context) {
              showDialog(
                context: context,
                builder: (ctx) => SimpleDialog(
                  title: const Text('اختر موعد نزول الراتب الشهري'),
                  children: [1, 25, 27, 28].map((d) {
                    return SimpleDialogOption(
                      onPressed: () {
                        HassalahApp.of(context)?.updateSalaryDay(d);
                        Navigator.pop(ctx);
                      },
                      child: Padding(
                        padding: const EdgeInsets.symmetric(vertical: 6),
                        child: Text(d == 1 ? 'بداية الشهر الميلادي (1)' : 'يوم $d من الشهر', style: const TextStyle(fontSize: 15)),
                      ),
                    );
                  }).toList(),
                ),
              );
            }
          }
