name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Fresh Clean Project
        run: |
          rm -rf lib android pubspec.yaml pubspec.lock .github/workflows/pubspec.yaml
          flutter create --org com.hassalah.app --platforms android .

      - name: Configure pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: hassalah
          description: "تطبيق حصالة لإدارة المصاريف"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: ^0.20.2
            sqflite: ^2.3.0
            path: ^1.9.0
            permission_handler: ^11.3.1
            fl_chart: ^0.68.0

          flutter:
            uses-material-design: true
          EOF

      - name: Configure Android Permissions & App Name
        run: |
          cat << 'EOF' > configure_android.py
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              content = f.read()

          perms = '''
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
          '''

          content = content.replace('<application', perms + '    <application')
          content = content.replace('android:label="masareefi"', 'android:label="حصّالة"')
          content = content.replace('android:label="hassalah"', 'android:label="حصّالة"')

          with open(p, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
          python3 configure_android.py

      - name: Build Database and Logic Files
        run: |
          cat << 'EOF' > lib/database_helper.dart
          import 'dart:async';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';

          class Expense {
            final int? id;
            final double amount;
            final String merchant;
            final DateTime date;
            final String cardLast4;
            final String type;
            final String category;
            final String smsHash;

            Expense({
              this.id,
              required this.amount,
              required this.merchant,
              required this.date,
              required this.cardLast4,
              required this.type,
              required this.category,
              required this.smsHash,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'amount': amount,
                'merchant': merchant,
                'date': date.toIso8601String(),
                'cardLast4': cardLast4,
                'type': type,
                'category': category,
                'smsHash': smsHash,
              };
            }

            factory Expense.fromMap(Map<String, dynamic> map) {
              return Expense(
                id: map['id'],
                amount: map['amount'],
                merchant: map['merchant'],
                date: DateTime.parse(map['date']),
                cardLast4: map['cardLast4'],
                type: map['type'],
                category: map['category'],
                smsHash: map['smsHash'],
              );
            }
          }

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('hassalah.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);

              return await openDatabase(
                path,
                version: 1,
                onCreate: _createDB,
              );
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE expenses (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  amount REAL NOT NULL,
                  merchant TEXT NOT NULL,
                  date TEXT NOT NULL,
                  cardLast4 TEXT NOT NULL,
                  type TEXT NOT NULL,
                  category TEXT NOT NULL,
                  smsHash TEXT UNIQUE NOT NULL
                )
              ''');
            }

            Future<bool> insertExpense(Expense expense) async {
              final db = await instance.database;
              try {
                await db.insert('expenses', expense.toMap(), conflictAlgorithm: ConflictAlgorithm.fail);
                return true;
              } catch (e) {
                return false;
              }
            }

            Future<List<Expense>> getAllExpenses() async {
              final db = await instance.database;
              final result = await db.query('expenses', orderBy: 'date DESC');
              return result.map((json) => Expense.fromMap(json)).toList();
            }

            Future<void> clearAll() async {
              final db = await instance.database;
              await db.delete('expenses');
            }
          }
          EOF

          cat << 'EOF' > lib/alrajhi_parser.dart
          class TransactionParsed {
            final double amount;
            final String merchant;
            final DateTime date;
            final String cardLast4;
            final String type;
            final String category;
            final String smsHash;

            TransactionParsed({
              required this.amount,
              required this.merchant,
              required this.date,
              required this.cardLast4,
              required this.type,
              required this.category,
              required this.smsHash,
            });
          }

          class AlRajhiParser {
            static TransactionParsed? parseSMS(String body, DateTime smsTime) {
              if (!body.contains('الراجحي') && !body.contains('مبلغ') && !body.contains('بطاقة') && !body.contains('شراء')) {
                return null;
              }

              double amount = 0.0;
              String merchant = 'غير محدد';
              String cardLast4 = '0000';
              String type = 'شراء';

              RegExp amountReg = RegExp(r'(?:بقيمة|بمبلغ)\s+([0-9]+(?:\.[0-9]+)?)\s*(?:SAR|ر.س)?');
              var amountMatch = amountReg.firstMatch(body);
              if (amountMatch != null) {
                amount = double.tryParse(amountMatch.group(1) ?? '0') ?? 0.0;
              } else {
                return null;
              }

              RegExp cardReg = RegExp(r'\(([0-9]{4})\)');
              var cardMatch = cardReg.firstMatch(body);
              if (cardMatch != null) {
                cardLast4 = cardMatch.group(1) ?? '0000';
              }

              if (body.contains('شراء') || body.contains('مدى')) {
                type = 'شراء';
                RegExp merchantReg = RegExp(r'لدى\s+([^\n\r]+?)(?=\s+في|\s+بقيمة|\.$|$)');
                var mMatch = merchantReg.firstMatch(body);
                if (mMatch != null) merchant = mMatch.group(1)!.trim();
              } else if (body.contains('سحب نقدي')) {
                type = 'سحب';
                merchant = 'صراف آلي';
              } else if (body.contains('تحويل')) {
                type = 'تحويلات';
                merchant = 'تحويل صادر';
              }

              String category = _categorize(merchant, body);
              String smsHash = '${body}_${smsTime.millisecondsSinceEpoch}'.hashCode.toString();

              return TransactionParsed(
                amount: amount,
                merchant: merchant,
                date: smsTime,
                cardLast4: cardLast4,
                type: type,
                category: category,
                smsHash: smsHash,
              );
            }

            static String _categorize(String merchant, String body) {
              String text = (merchant + " " + body).toLowerCase();

              if (text.contains('قهوة') || text.contains('كافيه') || text.contains('starbucks') || text.contains('barns')) return 'قهوة';
              if (text.contains('مطعم') || text.contains('mcdonalds') || text.contains('albaik') || text.contains('شاورما') || text.contains('برجر')) return 'مطاعم';
              if (text.contains('بنزين') || text.contains('الدريس') || text.contains('ساسكو') || text.contains('محطة')) return 'بنزين';
              if (text.contains('بندة') || text.contains('العثيم') || text.contains('سوبرماركت') || text.contains('تموينات') || text.contains('لولو')) return 'سوبر ماركت';
              if (text.contains('فاتورة') || text.contains('stc') || text.contains('موبايلي') || text.contains('كهرباء') || text.contains('مياه')) return 'فواتير';
              if (text.contains('تحويل')) return 'تحويلات';
              if (text.contains('amazon') || text.contains('noon') || text.contains('نون') || text.contains('امازون') || text.contains('زارا')) return 'تسوق';
              return 'أخرى';
            }
          }
          EOF

      - name: Build Application UI Source Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:intl/intl.dart';
          import 'package:fl_chart/fl_chart.dart';
          import 'package:permission_handler/permission_handler.dart';

          import 'database_helper.dart';
          import 'alrajhi_parser.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const HassalahApp());
          }

          class HassalahApp extends StatefulWidget {
            const HassalahApp({super.key});

            static _HassalahAppState? of(BuildContext context) =>
                context.findAncestorStateOfType<_HassalahAppState>();

            @override
            State<HassalahApp> createState() => _HassalahAppState();
          }

          class _HassalahAppState extends State<HassalahApp> {
            int salaryStartDay = 25;
            String houseName = 'السعودية';
            String currency = 'ر.س';
            double monthlyBudget = 4000.0;

            void updateSalaryDay(int day) => setState(() => salaryStartDay = day);
            void updateHouseName(String name) => setState(() => houseName = name);
            void updateBudget(double budget) => setState(() => monthlyBudget = budget);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حصّالة',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar', 'SA'),
                supportedLocales: const [Locale('ar', 'SA')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF8F5EE),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFC85A32),
                    primary: const Color(0xFFC85A32),
                    secondary: const Color(0xFFD46238),
                    surface: Colors.white,
                  ),
                ),
                home: const MainNavigationHolder(),
              );
            }
          }

          class MainNavigationHolder extends StatefulWidget {
            const MainNavigationHolder({super.key});

            @override
            State<MainNavigationHolder> createState() => _MainNavigationHolderState();
          }

          class _MainNavigationHolderState extends State<MainNavigationHolder> {
            int _currentIndex = 0;
            List<Expense> _expenses = [];
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _loadExpenses();
            }

            Future<void> _loadExpenses() async {
              final list = await DatabaseHelper.instance.getAllExpenses();
              setState(() {
                _expenses = list;
                _isLoading = false;
              });
            }

            void _showAddExpenseDialog() {
              final merchantController = TextEditingController();
              final amountController = TextEditingController();
              String selectedCategory = 'مطاعم';

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: Colors.white,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (ctx) {
                  return StatefulBuilder(
                    builder: (context, setModalState) {
                      return Padding(
                        padding: EdgeInsets.only(
                          bottom: MediaQuery.of(ctx).viewInsets.bottom + 20,
                          top: 20,
                          left: 20,
                          right: 20,
                        ),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Center(
                              child: Text(
                                'إضافة عملية يدوية',
                                style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF2D2825)),
                              ),
                            ),
                            const SizedBox(height: 16),
                            TextField(
                              controller: merchantController,
                              decoration: InputDecoration(
                                labelText: 'اسم التاجر / المتجر',
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: amountController,
                              keyboardType: TextInputType.number,
                              decoration: InputDecoration(
                                labelText: 'المبلغ (ر.س)',
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                            ),
                            const SizedBox(height: 12),
                            DropdownButtonFormField<String>(
                              value: selectedCategory,
                              decoration: InputDecoration(
                                labelText: 'التصنيف',
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                              ),
                              items: ['مطاعم', 'قهوة', 'بنزين', 'سوبر ماركت', 'فواتير', 'تسوق', 'تحويلات', 'أخرى']
                                  .map((c) => DropdownMenuItem(value: c, child: Text(c)))
                                  .toList(),
                              onChanged: (val) {
                                if (val != null) setModalState(() => selectedCategory = val);
                              },
                            ),
                            const SizedBox(height: 20),
                            SizedBox(
                              width: double.infinity,
                              height: 50,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFC85A32),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                                ),
                                onPressed: () async {
                                  double amt = double.tryParse(amountController.text) ?? 0.0;
                                  if (amt > 0 && merchantController.text.isNotEmpty) {
                                    Expense newExp = Expense(
                                      amount: amt,
                                      merchant: merchantController.text,
                                      date: DateTime.now(),
                                      cardLast4: '0000',
                                      type: 'يدوي',
                                      category: selectedCategory,
                                      smsHash: 'manual_${DateTime.now().millisecondsSinceEpoch}',
                                    );
                                    await DatabaseHelper.instance.insertExpense(newExp);
                                    Navigator.pop(ctx);
                                    _loadExpenses();
                                  }
                                },
                                child: const Text('حفظ العملية', style: TextStyle(fontSize: 16, color: Colors.white, fontWeight: FontWeight.bold)),
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              final screens = [
                HomeScreen(expenses: _expenses, isLoading: _isLoading, onRefresh: _loadExpenses),
                ReportsScreen(expenses: _expenses),
                BudgetScreen(expenses: _expenses),
                const SettingsScreen(),
              ];

              return Scaffold(
                body: screens[_currentIndex],
                bottomNavigationBar: Container(
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: const BorderRadius.only(
                      topLeft: Radius.circular(24),
                      topRight: Radius.circular(24),
                    ),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withOpacity(0.06),
                        blurRadius: 16,
                        offset: const Offset(0, -4),
                      ),
                    ],
                  ),
                  child: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 8),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceAround,
                        children: [
                          _buildNavItem(0, Icons.home_rounded, 'الرئيسية'),
                          _buildNavItem(1, Icons.bar_chart_rounded, 'التقارير'),
                          _buildAddButton(),
                          _buildNavItem(2, Icons.account_balance_rounded, 'الميزانية'),
                          _buildNavItem(3, Icons.settings_rounded, 'الإعدادات'),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget _buildNavItem(int index, IconData icon, String label) {
              final isSelected = _currentIndex == index;
              return InkWell(
                onTap: () => setState(() => _currentIndex = index),
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                  decoration: isSelected
                      ? BoxDecoration(
                          color: const Color(0xFFC85A32).withOpacity(0.12),
                          borderRadius: BorderRadius.circular(14),
                        )
                      : null,
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(
                        icon,
                        color: isSelected ? const Color(0xFFC85A32) : const Color(0xFF8C827A),
                        size: 24,
                      ),
                      const SizedBox(height: 4),
                      Text(
                        label,
                        style: TextStyle(
                          fontSize: 12,
                          fontWeight: isSelected ? FontWeight.bold : FontWeight.normal,
                          color: isSelected ? const Color(0xFFC85A32) : const Color(0xFF8C827A),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildAddButton() {
              return GestureDetector(
                onTap: _showAddExpenseDialog,
                child: Container(
                  width: 50,
                  height: 50,
                  decoration: BoxDecoration(
                    color: const Color(0xFFC85A32),
                    shape: BoxShape.circle,
                    boxShadow: [
                      BoxShadow(
                        color: const Color(0xFFC85A32).withOpacity(0.35),
                        blurRadius: 10,
                        offset: const Offset(0, 4),
                      ),
                    ],
                  ),
                  child: const Icon(Icons.add, color: Colors.white, size: 28),
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final List<Expense> expenses;
            final bool isLoading;
            final VoidCallback onRefresh;

            const HomeScreen({super.key, required this.expenses, required this.isLoading, required this.onRefresh});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String _selectedCategory = 'الكل';
            String _searchQuery = '';

            final List<String> _categories = [
              'الكل', 'مطاعم', 'قهوة', 'بنزين', 'سوبر ماركت', 'فواتير', 'تسوق', 'تحويلات', 'أخرى'
            ];

            @override
            Widget build(BuildContext context) {
              final appState = HassalahApp.of(context);
              final now = DateTime.now();

              double todayExp = widget.expenses
                  .where((e) => e.date.year == now.year && e.date.month == now.month && e.date.day == now.day)
                  .fold(0.0, (sum, i) => sum + i.amount);

              double monthExp = widget.expenses
                  .where((e) => e.date.year == now.year && e.date.month == now.month)
                  .fold(0.0, (sum, i) => sum + i.amount);

              double remaining = (appState?.monthlyBudget ?? 4000.0) - monthExp;

              final filtered = widget.expenses.where((e) {
                bool catMatch = _selectedCategory == 'الكل' || e.category == _selectedCategory;
                bool searchMatch = e.merchant.toLowerCase().contains(_searchQuery.toLowerCase()) || e.category.contains(_searchQuery);
                return catMatch && searchMatch;
              }).toList();

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(8),
                        decoration: BoxDecoration(
                          color: const Color(0xFFC85A32).withOpacity(0.12),
                          borderRadius: BorderRadius.circular(12),
                        ),
                        child: const Text('🪙', style: TextStyle(fontSize: 20)),
                      ),
                      const SizedBox(width: 10),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('حصّالة', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                          Text(appState?.houseName ?? 'السعودية', style: const TextStyle(fontSize: 12, color: Color(0xFF8C827A))),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.refresh_rounded, color: Color(0xFFC85A32)),
                      onPressed: widget.onRefresh,
                      tooltip: 'تحديث',
                    ),
                  ],
                ),
                body: widget.isLoading
                    ? const Center(child: CircularProgressIndicator())
                    : RefreshIndicator(
                        onRefresh: () async => widget.onRefresh(),
                        child: ListView(
                          padding: const EdgeInsets.all(16),
                          children: [
                            Row(
                              children: [
                                _buildStatCard('اليوم', '${todayExp.toStringAsFixed(1)} ر.س', const Color(0xFFC85A32)),
                                const SizedBox(width: 8),
                                _buildStatCard('الشهر الحالي', '${monthExp.toStringAsFixed(1)} ر.س', const Color(0xFF3F6A44)),
                                const SizedBox(width: 8),
                                _buildStatCard('المتبقي', '${remaining.toStringAsFixed(1)} ر.س', const Color(0xFF4A6B82)),
                              ],
                            ),
                            const SizedBox(height: 20),

                            TextField(
                              onChanged: (val) => setState(() => _searchQuery = val),
                              decoration: InputDecoration(
                                hintText: 'بحث في العمليات أو المتاجر...',
                                hintStyle: const TextStyle(color: Color(0xFFA0988F), fontSize: 14),
                                prefixIcon: const Icon(Icons.search, color: Color(0xFF8C827A)),
                                filled: true,
                                fillColor: Colors.white,
                                contentPadding: const EdgeInsets.symmetric(vertical: 0, horizontal: 16),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(14),
                                  borderSide: const BorderSide(color: Color(0xFFEDE8DE)),
                                ),
                                enabledBorder: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(14),
                                  borderSide: const BorderSide(color: Color(0xFFEDE8DE)),
                                ),
                              ),
                            ),
                            const SizedBox(height: 14),

                            SizedBox(
                              height: 38,
                              child: ListView.builder(
                                scrollDirection: Axis.horizontal,
                                itemCount: _categories.length,
                                itemBuilder: (ctx, i) {
                                  final cat = _categories[i];
                                  final isSel = cat == _selectedCategory;
                                  return Padding(
                                    padding: const EdgeInsets.only(left: 8),
                                    child: ChoiceChip(
                                      label: Text(cat),
                                      labelStyle: TextStyle(
                                        color: isSel ? Colors.white : const Color(0xFF5D544C),
                                        fontSize: 13,
                                        fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                                      ),
                                      selected: isSel,
                                      selectedColor: const Color(0xFFC85A32),
                                      backgroundColor: Colors.white,
                                      side: BorderSide(color: isSel ? const Color(0xFFC85A32) : const Color(0xFFEDE8DE)),
                                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                      onSelected: (val) {
                                        if (val) setState(() => _selectedCategory = cat);
                                      },
                                    ),
                                  );
                                },
                              ),
                            ),
                            const SizedBox(height: 20),

                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text('سجل العمليات', style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                                Text('${filtered.length} عملية', style: const TextStyle(color: Color(0xFF8C827A), fontSize: 13)),
                              ],
                            ),
                            const SizedBox(height: 10),

                            if (filtered.isEmpty)
                              Container(
                                padding: const EdgeInsets.all(32),
                                alignment: Alignment.center,
                                child: Column(
                                  children: const [
                                    Icon(Icons.receipt_long_outlined, size: 48, color: Color(0xFFBFB7AC)),
                                    SizedBox(height: 12),
                                    Text('لا توجد عمليات مسجلة حتى الآن', style: TextStyle(color: Color(0xFF8C827A))),
                                  ],
                                ),
                              )
                            else
                              ...filtered.map((item) => Card(
                                    margin: const EdgeInsets.symmetric(vertical: 4),
                                    child: ListTile(
                                      leading: Container(
                                        width: 44,
                                        height: 44,
                                        decoration: BoxDecoration(
                                          color: const Color(0xFFF8F5EE),
                                          borderRadius: BorderRadius.circular(12),
                                        ),
                                        alignment: Alignment.center,
                                        child: Text(_getCategoryEmoji(item.category), style: const TextStyle(fontSize: 20)),
                                      ),
                                      title: Text(item.merchant, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                                      subtitle: Text('${DateFormat('yyyy/MM/dd HH:mm').format(item.date)} • ${item.category}', style: const TextStyle(fontSize: 12, color: Color(0xFF8C827A))),
                                      trailing: Text(
                                        '${item.amount.toStringAsFixed(2)} ر.س',
                                        style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFFC85A32), fontSize: 15),
                                      ),
                                    ),
                                  )),
                          ],
                        ),
                      ),
              );
            }

            String _getCategoryEmoji(String cat) {
              switch (cat) {
                case 'مطاعم': return '🍔';
                case 'قهوة': return '☕';
                case 'بنزين': return '⛽';
                case 'سوبر ماركت': return '🛒';
                case 'فواتير': return '⚡';
                case 'تحويلات': return '💸';
                case 'تسوق': return '🛍️';
                default: return '🪙';
              }
            }

            Widget _buildStatCard(String title, String value, Color color) {
              return Expanded(
                child: Container(
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: const Color(0xFFEDE8DE)),
                  ),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(title, style: const TextStyle(fontSize: 12, color: Color(0xFF8C827A))),
                      const SizedBox(height: 6),
                      FittedBox(
                        child: Text(
                          value,
                          style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: color),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ReportsScreen extends StatefulWidget {
            final List<Expense> expenses;
            const ReportsScreen({super.key, required this.expenses});

            @override
            State<ReportsScreen> createState() => _ReportsScreenState();
          }

          class _ReportsScreenState extends State<ReportsScreen> {
            int _selectedYear = 2026;
            int _selectedMonth = 8;

            final List<int> _years = [2026, 2025, 2024];
            final List<String> _months = [
              'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
              'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
            ];

            @override
            Widget build(BuildContext context) {
              final currentMonthExpenses = widget.expenses.where((e) {
                return e.date.year == _selectedYear && e.date.month == _selectedMonth;
              }).toList();

              double total = currentMonthExpenses.fold(0.0, (sum, i) => sum + i.amount);

              Map<String, double> categoryTotals = {};
              for (var exp in currentMonthExpenses) {
                categoryTotals[exp.category] = (categoryTotals[exp.category] ?? 0.0) + exp.amount;
              }

              final colors = [
                const Color(0xFFC85A32),
                const Color(0xFF3F6A44),
                const Color(0xFFD4A359),
                const Color(0xFF4A6B82),
                const Color(0xFF8E5A7C),
                const Color(0xFF7A8B7B),
              ];

              int colorIdx = 0;
              List<PieChartSectionData> sections = [];
              categoryTotals.forEach((cat, amt) {
                sections.add(
                  PieChartSectionData(
                    value: amt,
                    title: '',
                    radius: 28,
                    color: colors[colorIdx % colors.length],
                  ),
                );
                colorIdx++;
              });

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: const Text('التقارير', style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                  actions: [
                    IconButton(icon: const Icon(Icons.share_outlined, color: Color(0xFF2D2825)), onPressed: () {}),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: _years.map((y) {
                        final isSel = y == _selectedYear;
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 4),
                          child: ChoiceChip(
                            label: Text('$y'),
                            labelStyle: TextStyle(
                              color: isSel ? Colors.white : const Color(0xFF5D544C),
                              fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                            ),
                            selected: isSel,
                            selectedColor: const Color(0xFF2D2825),
                            backgroundColor: Colors.white,
                            side: BorderSide(color: isSel ? const Color(0xFF2D2825) : const Color(0xFFEDE8DE)),
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                            onSelected: (val) {
                              if (val) setState(() => _selectedYear = y);
                            },
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 12),

                    SizedBox(
                      height: 38,
                      child: ListView.builder(
                        scrollDirection: Axis.horizontal,
                        itemCount: _months.length,
                        itemBuilder: (ctx, i) {
                          final mIndex = i + 1;
                          final isSel = mIndex == _selectedMonth;
                          return Padding(
                            padding: const EdgeInsets.only(left: 6),
                            child: ChoiceChip(
                              label: Text(_months[i]),
                              labelStyle: TextStyle(
                                color: isSel ? Colors.white : const Color(0xFF5D544C),
                                fontSize: 13,
                                fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                              ),
                              selected: isSel,
                              selectedColor: const Color(0xFFC85A32),
                              backgroundColor: Colors.white,
                              side: BorderSide(color: isSel ? const Color(0xFFC85A32) : const Color(0xFFEDE8DE)),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                              onSelected: (val) {
                                if (val) setState(() => _selectedMonth = mIndex);
                              },
                            ),
                          );
                        },
                      ),
                    ),
                    const SizedBox(height: 24),

                    Center(
                      child: SizedBox(
                        width: 220,
                        height: 220,
                        child: Stack(
                          alignment: Alignment.center,
                          children: [
                            PieChart(
                              PieChartData(
                                sectionsSpace: 2,
                                centerSpaceRadius: 75,
                                sections: sections.isEmpty
                                    ? [
                                        PieChartSectionData(
                                          value: 1,
                                          color: const Color(0xFFEDE8DE),
                                          radius: 28,
                                          showTitle: false,
                                        )
                                      ]
                                    : sections,
                              ),
                            ),
                            Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Text('إجمالي', style: TextStyle(color: Color(0xFF8C827A), fontSize: 13)),
                                const SizedBox(height: 4),
                                Text(
                                  total.toStringAsFixed(2),
                                  style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF2D2825)),
                                ),
                                const SizedBox(height: 2),
                                const Text('ر.س', style: TextStyle(fontSize: 12, color: Color(0xFF8C827A))),
                                const SizedBox(height: 4),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF3F6A44).withOpacity(0.12),
                                    borderRadius: BorderRadius.circular(10),
                                  ),
                                  child: const Text('↓ 99%', style: TextStyle(fontSize: 11, color: Color(0xFF3F6A44), fontWeight: FontWeight.bold)),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 24),

                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: const Color(0xFFEDE8DE)),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('التفصيل', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                          const SizedBox(height: 12),
                          if (categoryTotals.isEmpty)
                            const Padding(
                              padding: EdgeInsets.all(16.0),
                              child: Center(child: Text('لا توجد مصاريف لهذا الشهر', style: TextStyle(color: Color(0xFF8C827A)))),
                            )
                          else
                            ...categoryTotals.entries.map((entry) {
                              final p = total > 0 ? (entry.value / total) : 0.0;
                              return Padding(
                                padding: const EdgeInsets.symmetric(vertical: 8),
                                child: Column(
                                  children: [
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        Text(entry.key, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                                        Text('${entry.value.toStringAsFixed(2)} ر.س • ${(p * 100).toStringAsFixed(0)}%',
                                            style: const TextStyle(color: Color(0xFF8C827A), fontSize: 13, fontWeight: FontWeight.bold)),
                                      ],
                                    ),
                                    const SizedBox(height: 6),
                                    LinearProgressIndicator(
                                      value: p,
                                      backgroundColor: const Color(0xFFF8F5EE),
                                      valueColor: const AlwaysStoppedAnimation(Color(0xFFC85A32)),
                                      minHeight: 6,
                                      borderRadius: BorderRadius.circular(6),
                                    ),
                                  ],
                                ),
                              );
                            }),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

