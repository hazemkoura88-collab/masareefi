                    ),
                    const SizedBox(width: 14),
                    Container(
                      width: 46,
                      height: 46,
                      decoration: BoxDecoration(color: iconBg, borderRadius: BorderRadius.circular(12)),
                      alignment: Alignment.center,
                      child: Text(iconEmoji, style: const TextStyle(fontSize: 22)),
                    ),
                  ],
                ),
              );
            }
          }

