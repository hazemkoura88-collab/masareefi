                            ),
                          ],
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Text(
                                  'إجمالي المصروف الشهري',
                                  style: TextStyle(color: Color(0xFFB4D2C8), fontSize: 14),
                                ),
