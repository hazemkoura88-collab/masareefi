      - name: Build Debug APK (Universally Installable)
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassalah-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
