                              ),
                            ),
                            const SizedBox(height: 12),

                            TextField(
                              controller: amountCtrl,
                              keyboardType: const TextInputType.numberWithOptions(decimal: true),
                              decoration: InputDecoration(
                                labelText: 'المبلغ بالريال السعودي (ر.س)',
                                filled: true,
                                fillColor: const Color(0xFFF3F7F5),
                                border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none),
                              ),
                            ),
                            const SizedBox(height: 12),

                            if (isInflow == 0)
                              DropdownButtonFormField<String>(
                                value: selectedCategory,
                                decoration: InputDecoration(
                                  labelText: 'التصنيف',
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none),
                                  filled: true,
                                  fillColor: const Color(0xFFF3F7F5),
                                ),
                                items: ['مطاعم', 'قهوة', 'بنزين', 'سوبر ماركت', 'فواتير', 'تسوق', 'تحويلات', 'صحة وطب', 'أخرى']
                                    .map((c) => DropdownMenuItem(value: c, child: Text(c)))
                                    .toList(),
                                onChanged: (val) {
                                  if (val != null) setModalState(() => selectedCategory = val);
                                },
                              ),
                            const SizedBox(height: 20),

                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF0C3B2E),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                                ),
                                onPressed: () async {
                                  double amt = double.tryParse(amountCtrl.text) ?? 0.0;
                                  if (amt > 0 && merchantCtrl.text.trim().isNotEmpty) {
                                    await DatabaseHelper.instance.insertExpense(Expense(
