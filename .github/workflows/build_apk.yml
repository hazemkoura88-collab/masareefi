                            const SizedBox(height: 16),

                            Row(
                              children: [
                                Expanded(
                                  child: ChoiceChip(
                                    label: const Center(child: Text('مصروف / صادر 🔴')),
                                    selected: isInflow == 0,
                                    selectedColor: const Color(0xFFEF4444).withOpacity(0.2),
                                    onSelected: (val) {
                                      if (val) setModalState(() => isInflow = 0);
                                    },
                                  ),
                                ),
                                const SizedBox(width: 8),
                                Expanded(
                                  child: ChoiceChip(
                                    label: const Center(child: Text('دخل / وارد 🟢')),
                                    selected: isInflow == 1,
                                    selectedColor: const Color(0xFF10B981).withOpacity(0.2),
                                    onSelected: (val) {
                                      if (val) {
                                        setModalState(() {
                                          isInflow = 1;
                                          selectedType = 'حوالة واردة';
                                          selectedCategory = 'دخل وإيداع';
