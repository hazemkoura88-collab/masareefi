          // 1. HOME SCREEN WITH TIME FILTER (اليومي / الأسبوعي / الشهري / الكل) & TYPE SEPARATION
          class HomeScreenTab extends StatefulWidget {
            final List<Expense> expenses;
            final bool isLoading;
            final VoidCallback onAddPressed;
            final VoidCallback onRefresh;

            const HomeScreenTab({
              super.key,
              required this.expenses,
              required this.isLoading,
              required this.onAddPressed,
              required this.onRefresh,
            });

            @override
            State<HomeScreenTab> createState() => _HomeScreenTabState();
          }

          class _HomeScreenTabState extends State<HomeScreenTab> {
            String _selectedPeriod = 'شهري';
            String _selectedFilterType = 'الكل';
            String _searchQuery = '';

            final List<String> _typeFilters = <String>[
              'الكل', 'مشتريات مدى', 'حوالات واردة', 'حوالات صادرة', 'سحب نقدي', 'سداد فاتورة'
            ];

            @override
            Widget build(BuildContext context) {
              final appState = HassalahApp.of(context);
              final now = DateTime.now();
              double budget = appState?.monthlyBudget ?? 5000.0;

              List<Expense> timeFiltered = widget.expenses.where((e) {
                if (_selectedPeriod == 'يومي') {
                  return e.date.year == now.year && e.date.month == now.month && e.date.day == now.day;
                } else if (_selectedPeriod == 'أسبوعي') {
                  final diff = now.difference(e.date).inDays;
                  return diff >= 0 && diff <= 7;
                } else if (_selectedPeriod == 'شهري') {
                  return e.date.year == now.year && e.date.month == now.month;
                }
                return true;
              }).toList();

              double totalOutflow = timeFiltered
                  .where((e) => e.isInflow == 0)
                  .fold(0.0, (sum, i) => sum + i.amount);

              double totalInflow = timeFiltered
                  .where((e) => e.isInflow == 1)
                  .fold(0.0, (sum, i) => sum + i.amount);

              double remaining = budget - totalOutflow;
              double progress = budget > 0 ? (totalOutflow / budget).clamp(0.0, 1.0) : 0.0;

              final List<Expense> displayedList = timeFiltered.where((e) {
                bool typeMatch = _selectedFilterType == 'الكل' || e.type.contains(_selectedFilterType) || e.category.contains(_selectedFilterType);
                bool searchMatch = e.merchant.toLowerCase().contains(_searchQuery.toLowerCase()) || e.category.contains(_searchQuery) || e.type.contains(_searchQuery);
                return typeMatch && searchMatch;
              }).toList();

              return Scaffold(
                body: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Row(
                            children: [
                              Container(
                                padding: const EdgeInsets.all(10),
                                decoration: BoxDecoration(
                                  gradient: const LinearGradient(
                                    colors: [Color(0xFF0C3B2E), Color(0xFF1D5D4B)],
                                  ),
                                  borderRadius: BorderRadius.circular(16),
                                  boxShadow: [
                                    BoxShadow(color: const Color(0xFF0C3B2E).withOpacity(0.2), blurRadius: 8, offset: const Offset(0, 3)),
                                  ],
                                ),
                                child: const Text('🪙', style: TextStyle(fontSize: 22)),
                              ),
                              const SizedBox(width: 12),
                              Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text(
                                    'تطبيق حصّالة',
                                    style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E)),
                                  ),
                                  Text(
                                    appState?.walletName ?? 'المحفظة الشخصية',
                                    style: const TextStyle(fontSize: 13, color: Color(0xFF718096)),
                                  ),
                                ],
                              ),
                            ],
                          ),
                          IconButton(
                            icon: const Icon(Icons.sync_rounded, color: Color(0xFF0C3B2E), size: 28),
                            onPressed: widget.onRefresh,
                            tooltip: 'مزامنة وتحديث الرسائل',
                          ),
                        ],
                      ),
                      const SizedBox(height: 14),

                      Container(
                        padding: const EdgeInsets.all(4),
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(color: const Color(0xFFE2EBE6)),
                        ),
                        child: Row(
                          children: ['يومي', 'أسبوعي', 'شهري', 'الكل'].map((period) {
                            final isSel = _selectedPeriod == period;
                            return Expanded(
                              child: GestureDetector(
                                onTap: () => setState(() => _selectedPeriod = period),
                                child: Container(
                                  padding: const EdgeInsets.symmetric(vertical: 8),
                                  decoration: BoxDecoration(
                                    color: isSel ? const Color(0xFF0C3B2E) : Colors.transparent,
                                    borderRadius: BorderRadius.circular(12),
