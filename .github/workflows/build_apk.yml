                    Column(
                      crossAxisAlignment: CrossAxisAlignment.end,
                      children: [
                        Text(title, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Color(0xFF2D2825))),
                        const SizedBox(height: 4),
