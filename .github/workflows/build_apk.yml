name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Clean Project Structure
        run: |
          rm -rf lib android pubspec.yaml pubspec.lock .github/workflows/pubspec.yaml
          flutter create --org com.hassalah.app --platforms android .

      - name: Configure pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: hassalah
          description: "تطبيق حصّالة الذكي لإدارة المصاريف والادخار"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: ^0.20.2
            sqflite: ^2.3.0
            path: ^1.9.0
            permission_handler: ^11.3.1
            fl_chart: ^0.68.0

          flutter:
            uses-material-design: true
          EOF

      - name: Configure Android Manifest, Permissions, and Native Kotlin SMS Reader
        run: |
          cat << 'EOF' > setup_android_engine.py
          import os, glob

          # 1. Update AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              perms = '''
                  <uses-permission android:name="android.permission.RECEIVE_SMS"/>
                  <uses-permission android:name="android.permission.READ_SMS"/>
                  <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
                  <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              '''
              
              content = content.replace('<application', perms + '    <application')
              content = content.replace('android:label="masareefi"', 'android:label="حصّالة"')
              content = content.replace('android:label="hassalah"', 'android:label="حصّالة"')
              
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 2. Inject Native Kotlin Code
          main_files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True) + glob.glob('android/app/src/main/**/MainActivity.java', recursive=True)

          for file_path in main_files:
              pkg_name = "com.hassalah.app.hassalah"
              with open(file_path, 'r', encoding='utf-8') as f:
                  for line in f:
                      if line.strip().startswith('package '):
                          pkg_name = line.strip().replace('package ', '').replace(';', '').strip()
                          break
              
              kotlin_code = f"""package {pkg_name}

          import android.database.Cursor
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {{
              private val CHANNEL = "com.hassalah.app/sms"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler {{ call, result ->
                      if (call.method == "getInboxSms") {{
                          try {{
                              val smsList = mutableListOf<Map<String, Any>>()
                              val cursor: Cursor? = contentResolver.query(
                                  Uri.parse("content://sms/inbox"),
                                  arrayOf("_id", "address", "body", "date"),
                                  null,
                                  null,
                                  "date DESC"
                              )
                              cursor?.use {{
                                  val addressIdx = it.getColumnIndex("address")
                                  val bodyIdx = it.getColumnIndex("body")
                                  val dateIdx = it.getColumnIndex("date")

                                  while (it.moveToNext()) {{
                                      val address = if (addressIdx != -1) it.getString(addressIdx) ?: "" else ""
                                      val body = if (bodyIdx != -1) it.getString(bodyIdx) ?: "" else ""
                                      val date = if (dateIdx != -1) it.getLong(dateIdx) else 0L

                                      smsList.add(
                                          mapOf(
                                              "address" to address,
                                              "body" to body,
                                              "date" to date
                                          )
                                      )
                                  }}
                              }}
                              result.success(smsList)
                          }} catch (e: Exception) {{
                              result.error("SMS_READ_FAILED", e.message ?: "Unknown error", null)
                          }}
                      }} else {{
                          result.notImplemented()
                      }}
                  }}
              }}
          }}
          """
              target_kt = file_path if file_path.endswith('.kt') else file_path.replace('.java', '.kt')
              if file_path.endswith('.java') and os.path.exists(file_path):
                  os.remove(file_path)
              with open(target_kt, 'w', encoding='utf-8') as f:
                  f.write(kotlin_code)
          EOF
          python3 setup_android_engine.py

      - name: Write Database and Advanced Bank SMS Classifier
        run: |
          cat << 'EOF' > lib/database_helper.dart
          import 'dart:async';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';

          class Expense {
            final int? id;
            final double amount;
            final String merchant;
            final DateTime date;
            final String cardLast4;
            final String type;
            final int isInflow; // 1 = دخل / وارد, 0 = صادر / مصروف
            final String category;
            final String smsHash;

            Expense({
              this.id,
              required this.amount,
              required this.merchant,
              required this.date,
              required this.cardLast4,
              required this.type,
              this.isInflow = 0,
              required this.category,
              required this.smsHash,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'amount': amount,
                'merchant': merchant,
                'date': date.toIso8601String(),
                'cardLast4': cardLast4,
                'type': type,
                'isInflow': isInflow,
                'category': category,
                'smsHash': smsHash,
              };
            }

            factory Expense.fromMap(Map<String, dynamic> map) {
              return Expense(
                id: map['id'],
                amount: (map['amount'] as num).toDouble(),
                merchant: map['merchant'] ?? 'عملية',
                date: DateTime.parse(map['date']),
                cardLast4: map['cardLast4'] ?? '0000',
                type: map['type'] ?? 'مشتريات مدى',
                isInflow: map['isInflow'] ?? 0,
                category: map['category'] ?? 'أخرى',
                smsHash: map['smsHash'] ?? '',
              );
            }
          }

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('hassalah_v2.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);

              return await openDatabase(
                path,
                version: 2,
                onCreate: _createDB,
                onUpgrade: (db, oldVersion, newVersion) async {
                  await db.execute('DROP TABLE IF EXISTS expenses');
                  await _createDB(db, newVersion);
                },
              );
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE expenses (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  amount REAL NOT NULL,
                  merchant TEXT NOT NULL,
                  date TEXT NOT NULL,
                  cardLast4 TEXT NOT NULL,
                  type TEXT NOT NULL,
                  isInflow INTEGER NOT NULL DEFAULT 0,
                  category TEXT NOT NULL,
                  smsHash TEXT UNIQUE NOT NULL
                )
              ''');
            }

            Future<bool> insertExpense(Expense expense) async {
              final db = await instance.database;
              try {
                await db.insert('expenses', expense.toMap(), conflictAlgorithm: ConflictAlgorithm.ignore);
                return true;
              } catch (e) {
                return false;
              }
            }

            Future<List<Expense>> getAllExpenses() async {
              final db = await instance.database;
              final result = await db.query('expenses', orderBy: 'date DESC');
              return result.map((json) => Expense.fromMap(json)).toList();
            }

            Future<void> clearAll() async {
              final db = await instance.database;
              await db.delete('expenses');
            }
          }
          EOF

          cat << 'EOF' > lib/alrajhi_parser.dart
          import 'database_helper.dart';

          class BankSmsParser {
            static Expense? parseSMS(String body, DateTime smsTime) {
              final cleaned = body.replaceAll('\u200f', '').replaceAll('\u200e', '').trim();
              final textLower = cleaned.toLowerCase();

              final inflowKeywords = ['إيداع', 'تم إيداع', 'حوالة واردة', 'استرجاع', 'عكس عملية', 'راتب', 'تمت إضافة', 'حوالة من', 'تحويل من', 'واردة من'];
              final outflowKeywords = ['شراء', 'خصم', 'مدى', 'سحب نقدي', 'حوالة صادرة', 'تحويل إلى', 'سداد', 'فاتورة', 'دفع', 'pos', 'atm', 'بطاقة', 'عملية'];

              bool isInflow = false;
              String txType = 'مشتريات مدى';

              if (inflowKeywords.any((k) => textLower.contains(k)) && !(textLower.contains('شراء') && !textLower.contains('استرجاع'))) {
                isInflow = true;
                if (textLower.contains('حوالة') || textLower.contains('تحويل')) {
                  txType = 'حوالة واردة';
                } else if (textLower.contains('راتب')) {
                  txType = 'راتب';
                } else if (textLower.contains('استرجاع') || textLower.contains('عكس')) {
                  txType = 'استرجاع عملية';
                } else {
                  txType = 'إيداع بنكي';
                }
              } else {
                if (textLower.contains('سحب نقدي') || textLower.contains('صراف')) {
                  txType = 'سحب نقدي';
                } else if (textLower.contains('حوالة') || textLower.contains('تحويل')) {
                  txType = 'حوالة صادرة';
                } else if (textLower.contains('فاتورة') || textLower.contains('سداد')) {
                  txType = 'سداد فاتورة';
                } else {
                  txType = 'مشتريات مدى';
                }
              }

              if (!isInflow && !outflowKeywords.any((k) => textLower.contains(k)) && !textLower.contains('sar') && !textLower.contains('ر.س') && !textLower.contains('ريال')) {
                return null;
              }

              double amount = 0.0;
              final m1 = RegExp(r'(?:بمبلغ|بقيمة|بـ|مبلغ|دفع|قيمة|خصم|شراء|إيداع|حوالة)\s*:?\s*(?:SAR|ر\.س|ريال|usd|\$)?\s*:?\s*([0-9]+(?:\.[0-9]+)?)', caseSensitive: false).firstMatch(cleaned);
              if (m1 != null) {
                amount = double.tryParse(m1.group(1) ?? '0') ?? 0.0;
              } else {
                final m2 = RegExp(r'([0-9]+(?:\.[0-9]+)?)\s*(?:SAR|ر\.س|ريال)', caseSensitive: false).firstMatch(cleaned);
                if (m2 != null) {
                  amount = double.tryParse(m2.group(1) ?? '0') ?? 0.0;
                } else {
                  final m3 = RegExp(r'(?:SAR|ر\.س|ريال)\s*([0-9]+(?:\.[0-9]+)?)', caseSensitive: false).firstMatch(cleaned);
                  if (m3 != null) {
                    amount = double.tryParse(m3.group(1) ?? '0') ?? 0.0;
                  }
                }
              }

              if (amount <= 0) return null;

              String merchant = '';
              final mReg1 = RegExp(r'لدى\s+([^.\n\r,]+?)(?=\s+(?:عبر|ببطاقة|بطاقة|بتاريخ|بمبلغ|في\s+[0-9]|الساعة|الرصيد)|\.|$)').firstMatch(cleaned);
              if (mReg1 != null && mReg1.group(1)!.trim().isNotEmpty) {
                merchant = mReg1.group(1)!.trim();
              } else {
                final mReg2 = RegExp(r'من متجر\s+([^.\n\r,]+?)(?=\s+(?:عبر|ببطاقة|بطاقة|بتاريخ|بمبلغ)|\.|$)').firstMatch(cleaned);
                if (mReg2 != null && mReg2.group(1)!.trim().isNotEmpty) {
                  merchant = mReg2.group(1)!.trim();
                } else {
                  final mReg3 = RegExp(r'من:\s*([^.\n\r,]+?)(?=\s+(?:عبر|بمبلغ|بقيمة|بطاقة)|\.|$)').firstMatch(cleaned);
                  if (mReg3 != null && mReg3.group(1)!.trim().isNotEmpty) {
                    merchant = mReg3.group(1)!.trim();
                  } else {
                    final mReg4 = RegExp(r'لـ\s+([^.\n\r,]+?)(?=\s+(?:عبر|بتاريخ|بمبلغ)|\.|$)').firstMatch(cleaned);
                    if (mReg4 != null && mReg4.group(1)!.trim().isNotEmpty) {
                      merchant = mReg4.group(1)!.trim();
                    } else {
                      final mReg5 = RegExp(r'إلى\s+([^.\n\r,]+?)(?=\s+(?:عبر|بتاريخ|بمبلغ)|\.|$)').firstMatch(cleaned);
                      if (mReg5 != null && mReg5.group(1)!.trim().isNotEmpty) {
                        merchant = mReg5.group(1)!.trim();
                      }
                    }
                  }
                }
              }

              if (merchant.isEmpty || merchant == 'متجر' || merchant == 'شركة' || merchant == 'حسابك' || merchant == 'بطاقتك') {
                if (isInflow) {
                  merchant = txType;
                } else if (txType == 'سحب نقدي') {
                  merchant = 'صراف آلي';
                } else if (txType == 'حوالة صادرة') {
                  merchant = 'تحويل صادر';
                } else if (txType == 'سداد فاتورة') {
                  merchant = 'سداد فاتورة';
                } else {
                  merchant = 'مشتريات';
                }
              }

              merchant = merchant.replaceAll(RegExp(r'^(متجر|شركة|مؤسسة|فرع)\s+'), '').trim();
              if (merchant.length > 35) merchant = merchant.substring(0, 35);

              String cardLast4 = '0000';
              final cardReg = RegExp(r'(?:\(|\*|بطاقة\s*|مدى\s*|حساب\s*)([0-9]{4})');
              final cMatch = cardReg.firstMatch(cleaned);
              if (cMatch != null) {
                cardLast4 = cMatch.group(1) ?? '0000';
              }

              String category = 'أخرى';
              if (isInflow) {
                category = 'دخل وإيداع';
              } else {
                String text = (merchant + " " + cleaned).toLowerCase();
                if (text.contains('قهوة') || text.contains('كافيه') || text.contains('starbucks') || text.contains('barns') || text.contains('coffee') || text.contains('cafe') || text.contains('دانكن') || text.contains('dunkin') || text.contains('كيان') || text.contains('بارنز') || text.contains('عنوان القهوة')) {
                  category = 'قهوة';
                } else if (text.contains('مطعم') || text.contains('mcdonalds') || text.contains('albaik') || text.contains('شاورما') || text.contains('برجر') || text.contains('burger') || text.contains('pizza') || text.contains('بيتزا') || text.contains('بيك') || text.contains('ماك') || text.contains('كنتاكي') || text.contains('وجبات') || text.contains('الرومانسية') || text.contains('طازج') || text.contains('كودو')) {
                  category = 'مطاعم';
                } else if (text.contains('بنزين') || text.contains('الدريس') || text.contains('ساسكو') || text.contains('محطة') || text.contains('وقود') || text.contains('نفط') || text.contains('petrol') || text.contains('سهل') || text.contains('هلا')) {
                  category = 'بنزين';
                } else if (text.contains('بندة') || text.contains('العثيم') || text.contains('سوبرماركت') || text.contains('تموينات') || text.contains('لولو') || text.contains('lulu') || text.contains('panda') || text.contains('carrefour') || text.contains('كارفور') || text.contains('بقالة') || text.contains('اسواق') || text.contains('الدانوب')) {
                  category = 'سوبر ماركت';
                } else if (text.contains('فاتورة') || text.contains('stc') || text.contains('موبايلي') || text.contains('كهرباء') || text.contains('مياه') || text.contains('زين') || text.contains('سداد') || text.contains('telecom')) {
                  category = 'فواتير';
                } else if (text.contains('تحويل') || text.contains('حوالة') || text.contains('transfer') || text.contains('سريع')) {
                  category = 'تحويلات';
                } else if (text.contains('amazon') || text.contains('noon') || text.contains('نون') || text.contains('امازون') || text.contains('زارا') || text.contains('zara') || text.contains('shein') || text.contains('نمشي') || text.contains('تسوق') || text.contains('جرير') || text.contains('اكسترا')) {
                  category = 'تسوق';
                } else if (text.contains('صيدلية') || text.contains('نهدي') || text.contains('pharmacy') || text.contains('مستشفى') || text.contains('دواء') || text.contains('الدواء') || text.contains('عيادة')) {
                  category = 'صحة وطب';
                }
              }

              String smsHash = '${amount}_${merchant}_${smsTime.millisecondsSinceEpoch}'.hashCode.toString();

              return Expense(
                amount: amount,
                merchant: merchant,
                date: smsTime,
                cardLast4: cardLast4,
                type: txType,
                isInflow: isInflow ? 1 : 0,
                category: category,
                smsHash: smsHash,
              );
            }
          }
          EOF

      - name: Write Application UI Code with Navigation & Time Period Switchers
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:intl/intl.dart';
          import 'package:fl_chart/fl_chart.dart';
          import 'package:permission_handler/permission_handler.dart';

          import 'database_helper.dart';
          import 'alrajhi_parser.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const HassalahApp());
          }

          class HassalahApp extends StatefulWidget {
            const HassalahApp({super.key});

            static _HassalahAppState? of(BuildContext context) =>
                context.findAncestorStateOfType<_HassalahAppState>();

            @override
            State<HassalahApp> createState() => _HassalahAppState();
          }

          class _HassalahAppState extends State<HassalahApp> {
            int salaryStartDay = 25;
            String walletName = 'المحفظة الشخصية';
            String currency = 'ر.س';
            double monthlyBudget = 5000.0;
            bool isBiometricEnabled = false;

            void updateSalaryDay(int day) => setState(() => salaryStartDay = day);
            void updateWalletName(String name) => setState(() => walletName = name);
            void updateBudget(double budget) => setState(() => monthlyBudget = budget);
            void toggleBiometric(bool val) => setState(() => isBiometricEnabled = val);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حصّالة',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar', 'SA'),
                supportedLocales: const [Locale('ar', 'SA')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF3F7F5),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF0C3B2E),
                    primary: const Color(0xFF0C3B2E),
                    secondary: const Color(0xFFE5A93C),
                    surface: Colors.white,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    centerTitle: false,
                    titleTextStyle: TextStyle(
                      color: Color(0xFF0C3B2E),
                      fontSize: 20,
                      fontWeight: FontWeight.bold,
                    ),
                    iconTheme: IconThemeData(color: Color(0xFF0C3B2E)),
                  ),
                ),
                home: const MainTabControllerScreen(),
              );
            }
          }

          class SmsService {
            static const MethodChannel _channel = MethodChannel('com.hassalah.app/sms');

            static Future<int> syncBankSms({bool forceClear = false}) async {
              final status = await Permission.sms.request();
              if (!status.isGranted) {
                return -1;
              }

              try {
                if (forceClear) {
                  await DatabaseHelper.instance.clearAll();
                }

                final List<dynamic>? rawMessages = await _channel.invokeMethod<List<dynamic>>('getInboxSms');
                if (rawMessages == null || rawMessages.isEmpty) {
                  return 0;
                }

                int newInserted = 0;
                for (final raw in rawMessages) {
                  final map = Map<String, dynamic>.from(raw as Map);
                  final String body = map['body'] ?? '';
                  final int dateMs = map['date'] ?? DateTime.now().millisecondsSinceEpoch;
                  final DateTime smsTime = DateTime.fromMillisecondsSinceEpoch(dateMs);

                  final Expense? expense = BankSmsParser.parseSMS(body, smsTime);
                  if (expense != null) {
                    final inserted = await DatabaseHelper.instance.insertExpense(expense);
                    if (inserted) {
                      newInserted++;
                    }
                  }
                }
                return newInserted;
              } catch (e) {
                return 0;
              }
            }
          }

          class SavingsBox {
            final String name;
            final double current;
            final double target;
            final String emoji;
            final Color color;

            SavingsBox({
              required this.name,
              required this.current,
              required this.target,
              required this.emoji,
              required this.color,
            });
          }

          class MainTabControllerScreen extends StatefulWidget {
            const MainTabControllerScreen({super.key});

            @override
            State<MainTabControllerScreen> createState() => _MainTabControllerScreenState();
          }

          class _MainTabControllerScreenState extends State<MainTabControllerScreen> {
            int _currentTab = 0;
            List<Expense> _expenses = [];
            bool _isLoading = true;

            final List<SavingsBox> _savingsBoxes = [
              SavingsBox(name: 'طوارئ وأمان', current: 3500, target: 10000, emoji: '🛡️', color: const Color(0xFF0C3B2E)),
              SavingsBox(name: 'سفر وإجازة', current: 2400, target: 6000, emoji: '✈️', color: const Color(0xFF0284C7)),
              SavingsBox(name: 'تجديد سيارة', current: 1200, target: 5000, emoji: '🚗', color: const Color(0xFFE5A93C)),
            ];

            @override
            void initState() {
              super.initState();
              _initAndSync();
            }

            Future<void> _initAndSync() async {
              await _loadData();
              await _syncSmsSilently();
            }

            Future<void> _loadData() async {
              final data = await DatabaseHelper.instance.getAllExpenses();
              setState(() {
                _expenses = data;
                _isLoading = false;
              });
            }

            Future<void> _syncSmsSilently() async {
              int res = await SmsService.syncBankSms();
              if (res > 0) {
                await _loadData();
              }
            }

            Future<void> _handleManualSync({bool fullReParse = false}) async {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(fullReParse ? 'جاري إعادة تصنيف وتحليل كافة الرسائل بدقة... ⏳' : 'جاري فحص وتحديث رسائل البنوك... ⏳')),
              );

              int count = await SmsService.syncBankSms(forceClear: fullReParse);
              await _loadData();

              if (count == -1) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
