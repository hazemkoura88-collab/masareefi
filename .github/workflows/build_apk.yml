                    _buildBudgetOptionTile('حساباتي', 'مفيش حسابات مسجّلة', '💳', const Color(0xFFE9F2F7)),
                    _buildBudgetOptionTile('التحويش', 'مفيش صناديق مسجّلة', '🏦', const Color(0xFFEBF4EE)),
                  ],
