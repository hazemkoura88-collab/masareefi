            String _getEmoji(String cat) {
              switch (cat) {
                case 'مطاعم': return '🍔';
                case 'قهوة': return '☕';
                case 'بنزين': return '⛽';
                case 'سوبر ماركت': return '🛒';
                case 'فواتير': return '⚡';
                case 'تحويلات': return '💸';
                case 'تسوق': return '🛍️';
                default: return '🪙';
              }
            }
          }

          class ReportsScreenTab extends StatefulWidget {
            final List<Expense> expenses;
            const ReportsScreenTab({super.key, required this.expenses});

            @override
            State<ReportsScreenTab> createState() => _ReportsScreenTabState();
          }

          class _ReportsScreenTabState extends State<ReportsScreenTab> {
            int _selectedYear = 2026;
            int _selectedMonth = 8;

            final List<int> _years = [2026, 2025, 2024];
            final List<String> _months = [
              'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
              'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
            ];

            @override
            Widget build(BuildContext context) {
              final filtered = widget.expenses.where((e) {
                return e.date.year == _selectedYear && e.date.month == _selectedMonth;
              }).toList();

              double total = filtered.fold(0.0, (sum, i) => sum + i.amount);

              Map<String, double> catTotals = {};
              for (var exp in filtered) {
                catTotals[exp.category] = (catTotals[exp.category] ?? 0.0) + exp.amount;
              }

              final palette = [
                const Color(0xFF0C3B2E),
                const Color(0xFFE5A93C),
                const Color(0xFF0284C7),
                const Color(0xFF10B981),
                const Color(0xFF8B5CF6),
                const Color(0xFFEC4899),
              ];

              int idx = 0;
              List<PieChartSectionData> sections = [];
              catTotals.forEach((k, v) {
                sections.add(PieChartSectionData(
                  value: v,
                  title: '',
                  radius: 26,
                  color: palette[idx % palette.length],
                ));
                idx++;
              });

              return Scaffold(
                appBar: AppBar(
                  title: const Text('التقارير والتحليلات 📊'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: _years.map((y) {
                        final isSel = y == _selectedYear;
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 4),
                          child: ChoiceChip(
                            label: Text('$y'),
                            selected: isSel,
                            selectedColor: const Color(0xFF0C3B2E),
                            backgroundColor: Colors.white,
                            labelStyle: TextStyle(
                              color: isSel ? Colors.white : const Color(0xFF4A5568),
                              fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                            ),
                            onSelected: (val) {
                              if (val) setState(() => _selectedYear = y);
                            },
                          ),
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 10),

                    SizedBox(
                      height: 38,
                      child: ListView.builder(
                        scrollDirection: Axis.horizontal,
                        itemCount: _months.length,
                        itemBuilder: (ctx, i) {
                          final mIndex = i + 1;
                          final isSel = mIndex == _selectedMonth;
                          return Padding(
                            padding: const EdgeInsets.only(left: 6),
                            child: ChoiceChip(
                              label: Text(_months[i]),
                              selected: isSel,
                              selectedColor: const Color(0xFFE5A93C),
                              backgroundColor: Colors.white,
                              labelStyle: TextStyle(
                                color: isSel ? Colors.white : const Color(0xFF4A5568),
                                fontWeight: isSel ? FontWeight.bold : FontWeight.normal,
                              ),
                              onSelected: (val) {
                                if (val) setState(() => _selectedMonth = mIndex);
                              },
                            ),
                          );
                        },
                      ),
                    ),
                    const SizedBox(height: 24),

                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: const Color(0xFFE2EBE6)),
                      ),
                      child: Column(
                        children: [
                          const Text(
                            'توزيع الإنفاق للشهر المختار',
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Color(0xFF0C3B2E)),
                          ),
                          const SizedBox(height: 20),
                          SizedBox(
                            height: 200,
                            child: Stack(
                              alignment: Alignment.center,
                              children: [
                                PieChart(
                                  PieChartData(
                                    sectionsSpace: 3,
                                    centerSpaceRadius: 65,
                                    sections: sections.isEmpty
                                        ? [
                                            PieChartSectionData(
                                              value: 1,
                                              color: const Color(0xFFE2E8F0),
                                              radius: 20,
                                              showTitle: false,
                                            )
                                          ]
                                        : sections,
                                  ),
                                ),
                                Column(
                                  mainAxisSize: MainAxisSize.min,
                                  children: [
                                    const Text('الإجمالي', style: TextStyle(color: Color(0xFF718096), fontSize: 12)),
                                    Text(
                                      total.toStringAsFixed(0),
                                      style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E)),
                                    ),
                                    const Text('ر.س', style: TextStyle(fontSize: 12, color: Color(0xFF718096))),
                                  ],
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),

                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(color: const Color(0xFFE2EBE6)),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('تفاصيل التصنيفات', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Color(0xFF0C3B2E))),
                          const SizedBox(height: 12),
                          if (catTotals.isEmpty)
                            const Padding(
                              padding: EdgeInsets.all(16.0),
                              child: Center(child: Text('لا توجد معاملات مسجلة في هذا الشهر', style: TextStyle(color: Color(0xFF718096)))),
                            )
                          else
                            ...catTotals.entries.map((e) {
                              double p = total > 0 ? (e.value / total) : 0.0;
                              return Padding(
                                padding: const EdgeInsets.symmetric(vertical: 8),
                                child: Column(
                                  children: [
                                    Row(
                                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                      children: [
                                        Text(e.key, style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0C3B2E))),
                                        Text(
                                          '${e.value.toStringAsFixed(1)} ر.س (${(p * 100).toStringAsFixed(0)}%)',
                                          style: const TextStyle(color: Color(0xFF718096), fontSize: 13, fontWeight: FontWeight.bold),
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 6),
                                    LinearProgressIndicator(
                                      value: p,
                                      backgroundColor: const Color(0xFFF3F7F5),
                                      valueColor: const AlwaysStoppedAnimation(Color(0xFF0C3B2E)),
                                      minHeight: 6,
                                      borderRadius: BorderRadius.circular(6),
                                    ),
                                  ],
                                ),
                              );
                            }),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

