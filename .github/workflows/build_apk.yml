name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Clean Project Structure
        run: |
          rm -rf lib android pubspec.yaml pubspec.lock .github/workflows/pubspec.yaml
          flutter create --org com.hassalah.app --platforms android .

      - name: Configure pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: hassalah
          description: "تطبيق حصّالة الذكي لإدارة المصاريف والادخار"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            intl: ^0.20.2
            sqflite: ^2.3.0
            path: ^1.9.0
            permission_handler: ^11.3.1
            fl_chart: ^0.68.0

          flutter:
            uses-material-design: true
          EOF

      - name: Configure Android Manifest & Permissions
        run: |
          cat << 'EOF' > configure_android.py
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              content = f.read()

          perms = '''
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
          '''

          content = content.replace('<application', perms + '    <application')
          content = content.replace('android:label="masareefi"', 'android:label="حصّالة"')
          content = content.replace('android:label="hassalah"', 'android:label="حصّالة"')

          with open(p, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
          python3 configure_android.py

      - name: Write Database Helper and AlRajhi Parser
        run: |
          cat << 'EOF' > lib/database_helper.dart
          import 'dart:async';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';

          class Expense {
            final int? id;
            final double amount;
            final String merchant;
            final DateTime date;
            final String cardLast4;
            final String type;
            final String category;
            final String smsHash;

            Expense({
              this.id,
              required this.amount,
              required this.merchant,
              required this.date,
              required this.cardLast4,
              required this.type,
              required this.category,
              required this.smsHash,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'amount': amount,
                'merchant': merchant,
                'date': date.toIso8601String(),
                'cardLast4': cardLast4,
                'type': type,
                'category': category,
                'smsHash': smsHash,
              };
            }

            factory Expense.fromMap(Map<String, dynamic> map) {
              return Expense(
                id: map['id'],
                amount: map['amount'],
                merchant: map['merchant'],
                date: DateTime.parse(map['date']),
                cardLast4: map['cardLast4'],
                type: map['type'],
                category: map['category'],
                smsHash: map['smsHash'],
              );
            }
          }

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('hassalah.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);

              return await openDatabase(
                path,
                version: 1,
                onCreate: _createDB,
              );
            }

            Future _createDB(Database db, int version) async {
              await db.execute('''
                CREATE TABLE expenses (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  amount REAL NOT NULL,
                  merchant TEXT NOT NULL,
                  date TEXT NOT NULL,
                  cardLast4 TEXT NOT NULL,
                  type TEXT NOT NULL,
                  category TEXT NOT NULL,
                  smsHash TEXT UNIQUE NOT NULL
                )
              ''');
            }

            Future<bool> insertExpense(Expense expense) async {
              final db = await instance.database;
              try {
                await db.insert('expenses', expense.toMap(), conflictAlgorithm: ConflictAlgorithm.fail);
                return true;
              } catch (e) {
                return false;
              }
            }

            Future<List<Expense>> getAllExpenses() async {
              final db = await instance.database;
              final result = await db.query('expenses', orderBy: 'date DESC');
              return result.map((json) => Expense.fromMap(json)).toList();
            }

            Future<void> clearAll() async {
              final db = await instance.database;
              await db.delete('expenses');
            }
          }
          EOF

          cat << 'EOF' > lib/alrajhi_parser.dart
          class TransactionParsed {
            final double amount;
            final String merchant;
            final DateTime date;
            final String cardLast4;
            final String type;
            final String category;
            final String smsHash;

            TransactionParsed({
              required this.amount,
              required this.merchant,
              required this.date,
              required this.cardLast4,
              required this.type,
              required this.category,
              required this.smsHash,
            });
          }

          class AlRajhiParser {
            static TransactionParsed? parseSMS(String body, DateTime smsTime) {
              if (!body.contains('الراجحي') && !body.contains('مبلغ') && !body.contains('بطاقة') && !body.contains('شراء')) {
                return null;
              }

              double amount = 0.0;
              String merchant = 'غير محدد';
              String cardLast4 = '0000';
              String type = 'شراء';

              RegExp amountReg = RegExp(r'(?:بقيمة|بمبلغ)\s+([0-9]+(?:\.[0-9]+)?)\s*(?:SAR|ر.س)?');
              var amountMatch = amountReg.firstMatch(body);
              if (amountMatch != null) {
                amount = double.tryParse(amountMatch.group(1) ?? '0') ?? 0.0;
              } else {
                return null;
              }

              RegExp cardReg = RegExp(r'\(([0-9]{4})\)');
              var cardMatch = cardReg.firstMatch(body);
              if (cardMatch != null) {
                cardLast4 = cardMatch.group(1) ?? '0000';
              }

              if (body.contains('شراء') || body.contains('مدى')) {
                type = 'شراء';
                RegExp merchantReg = RegExp(r'لدى\s+([^\n\r]+?)(?=\s+في|\s+بقيمة|\.$|$)');
                var mMatch = merchantReg.firstMatch(body);
                if (mMatch != null) merchant = mMatch.group(1)!.trim();
              } else if (body.contains('سحب نقدي')) {
                type = 'سحب';
                merchant = 'صراف آلي';
              } else if (body.contains('تحويل')) {
                type = 'تحويلات';
                merchant = 'تحويل صادر';
              }

              String category = _categorize(merchant, body);
              String smsHash = '${body}_${smsTime.millisecondsSinceEpoch}'.hashCode.toString();

              return TransactionParsed(
                amount: amount,
                merchant: merchant,
                date: smsTime,
                cardLast4: cardLast4,
                type: type,
                category: category,
                smsHash: smsHash,
              );
            }

            static String _categorize(String merchant, String body) {
              String text = (merchant + " " + body).toLowerCase();

              if (text.contains('قهوة') || text.contains('كافيه') || text.contains('starbucks') || text.contains('barns')) return 'قهوة';
              if (text.contains('مطعم') || text.contains('mcdonalds') || text.contains('albaik') || text.contains('شاورما') || text.contains('برجر')) return 'مطاعم';
              if (text.contains('بنزين') || text.contains('الدريس') || text.contains('ساسكو') || text.contains('محطة')) return 'بنزين';
              if (text.contains('بندة') || text.contains('العثيم') || text.contains('سوبرماركت') || text.contains('تموينات') || text.contains('لولو')) return 'سوبر ماركت';
              if (text.contains('فاتورة') || text.contains('stc') || text.contains('موبايلي') || text.contains('كهرباء') || text.contains('مياه')) return 'فواتير';
              if (text.contains('تحويل')) return 'تحويلات';
              if (text.contains('amazon') || text.contains('noon') || text.contains('نون') || text.contains('امازون') || text.contains('زارا')) return 'تسوق';
              return 'أخرى';
            }
          }
          EOF

      - name: Write Application UI Source Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:intl/intl.dart';
          import 'package:fl_chart/fl_chart.dart';
          import 'package:permission_handler/permission_handler.dart';

          import 'database_helper.dart';
          import 'alrajhi_parser.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const HassalahApp());
          }

          class HassalahApp extends StatefulWidget {
            const HassalahApp({super.key});

            static _HassalahAppState? of(BuildContext context) =>
                context.findAncestorStateOfType<_HassalahAppState>();

            @override
            State<HassalahApp> createState() => _HassalahAppState();
          }

          class _HassalahAppState extends State<HassalahApp> {
            int salaryStartDay = 25;
            String walletName = 'المحفظة الشخصية';
            String currency = 'ر.س';
            double monthlyBudget = 5000.0;
            bool isBiometricEnabled = false;

            void updateSalaryDay(int day) => setState(() => salaryStartDay = day);
            void updateWalletName(String name) => setState(() => walletName = name);
            void updateBudget(double budget) => setState(() => monthlyBudget = budget);
            void toggleBiometric(bool val) => setState(() => isBiometricEnabled = val);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حصّالة',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar', 'SA'),
                supportedLocales: const [Locale('ar', 'SA')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF3F7F5),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF0C3B2E),
                    primary: const Color(0xFF0C3B2E),
                    secondary: const Color(0xFFE5A93C),
                    surface: Colors.white,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    centerTitle: false,
                    titleTextStyle: TextStyle(
                      color: Color(0xFF0C3B2E),
                      fontSize: 20,
                      fontWeight: FontWeight.bold,
                    ),
                    iconTheme: IconThemeData(color: Color(0xFF0C3B2E)),
                  ),
                ),
                home: const MainTabControllerScreen(),
              );
            }
          }

          class SavingsBox {
