            void _editBudgetDialog(BuildContext context, double currentBudget) {
              final controller = TextEditingController(text: currentBudget.toStringAsFixed(0));
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: const Text('تعديل سقف الميزانية الشهري'),
                  content: TextField(
                    controller: controller,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(labelText: 'الميزانية (ر.س)'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('إلغاء')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0C3B2E)),
                      onPressed: () {
                        double? val = double.tryParse(controller.text);
                        if (val != null && val > 0) {
                          HassalahApp.of(context)?.updateBudget(val);
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text('حفظ', style: TextStyle(color: Colors.white)),
                    ),
                  ],
                ),
              );
            }
          }

